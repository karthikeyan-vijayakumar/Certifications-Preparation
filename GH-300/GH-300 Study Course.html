 {q:'Select the statements that accurately align with Responsible AI.',o:['Reliability and safety: operate consistently and safely under expected conditions','Privacy and security: protect data and enforce access controls','Transparency: stakeholders can understand, review and audit','Fairness: reduce unjustified differential impacts','Accountability: the AI system itself is responsible for outcomes'],a:[0,1,2,3],w:'Accountability stays with people and organizations.'},
 {q:'A prompt "Add support for expedited shipping" produced breaking changes. What first?',o:['Add the API contract, nearby code, expected behavior and constraints, and keep it focused','Remove the description','Upgrade the plan','Open every file in the repo'],a:[0],w:'Context is what was missing, but focused context.'},
 {q:'Which describes the code suggestion lifecycle correctly?',o:['Context, prompt build, secure transmission, proxy filtering, model, post-processing, suggestion','Model, then context, then proxy','Post-processing before the model','Suggestion before context'],a:[0],w:'This is the order to remember.'},
 {q:'The developer says the ghcs alias means commands need no review. True or false?',o:['True','False'],a:[1],w:'Review is still required before running commands.'},
 {q:'Which makes agent tasks easier to govern? Select all that apply.',o:['Bounded scope and objectives','Review expectations before acceptance','Acceptance criteria','Limited permissions and tools','Authority to change anything'],a:[0,1,2,3],w:'Least privilege.'}
]}
];

/* ---------- state ---------- */
const S = Object.assign({mi:0, si:0, playing:false, rate:1, voice:'', voiceOn:true, seen:{}, scores:{}}, store.get());
S.playing = false;
const tokenBox = {t:0};
let sentences = [], sIdx = 0, timer = null;
let voices = [];

const mod = () => MODS[S.mi];
const slides = () => mod().slides;
const isQuiz = () => S.si >= slides().length;
const totalSlides = MODS.reduce((n,m)=>n+m.slides.length,0);
const key = (mi,si) => MODS[mi].id+':'+si;
const save = () => store.set({mi:S.mi, si:S.si, rate:S.rate, voice:S.voice, voiceOn:S.voiceOn, seen:S.seen, scores:S.scores});

/* ---------- speech ---------- */
const PRON = [[/GH-300/g,'G H three hundred'],[/\bAI\b/g,'A I'],[/\bMCP\b/g,'M C P'],[/\bCLI\b/g,'C L I'],[/\bIDEs?\b/g,'I D E'],[/\bLLMs?\b/g,'L L M'],[/\bAPI\b/g,'A P I'],[/\bCI\b/g,'C I'],[/\bIP\b/g,'I P'],[/\bPR\b/g,'P R']];
const sp = t => PRON.reduce((s,[r,v])=>s.replace(r,v), t);
const splitSentences = t => (t.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [t]).map(s=>s.trim()).filter(Boolean);
const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

function loadVoices(){
  if(!canSpeak) return;
  voices = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  const sel = $('#voice');
  if(!voices.length){ sel.innerHTML = '<option>Default voice</option>'; return; }
  const pref = v => /natural|neural|online/i.test(v.name)?0:/google us|samantha|aria|jenny|ava|daniel|serena/i.test(v.name)?1:2;
  voices.sort((a,b)=>pref(a)-pref(b)||a.name.localeCompare(b.name));
  sel.innerHTML = voices.map(v=>`<option value="${esc(v.voiceURI)}">${esc(v.name)}</option>`).join('');
  if(!voices.some(v=>v.voiceURI===S.voice)) S.voice = voices[0].voiceURI;
  sel.value = S.voice;
}

function stopSpeech(){
  tokenBox.t++; clearTimeout(timer); timer = null;
  if(canSpeak) speechSynthesis.cancel();
}

function markSentence(i){
  document.querySelectorAll('.cap .s').forEach((el,k)=>el.classList.toggle('on', k===i));
}

function speakFrom(i){
  const my = ++tokenBox.t; clearTimeout(timer);
  if(canSpeak) speechSynthesis.cancel();
  sIdx = i;
  const next = () => {
    if(my !== tokenBox.t || !S.playing) return;
    if(sIdx >= sentences.length){ markSentence(-1); slideDone(); return; }
    const text = sentences[sIdx]; markSentence(sIdx);
    const done = () => { if(my !== tokenBox.t) return; sIdx++; next(); };
    if(S.voiceOn && canSpeak){
      const u = new SpeechSynthesisUtterance(sp(text));
      u.rate = S.rate; const v = voices.find(v=>v.voiceURI===S.voice); if(v){ u.voice = v; u.lang = v.lang; }
      u.onend = done; u.onerror = e => { if(e.error==='interrupted'||e.error==='canceled') return; done(); };
      setTimeout(()=>{ if(my===tokenBox.t) speechSynthesis.speak(u); }, 40);
    } else {
      const words = text.split(/\s+/).length; timer = setTimeout(done, Math.max(1200, words/(2.6*S.rate)*1000));
    }
  };
  next();
}

function slideDone(){
  S.seen[key(S.mi,S.si)] = 1; save(); paintProgress();
  if(S.si < slides().length-1){ S.si++; renderStage(); speakFrom(0); }
  else { S.si = slides().length; S.playing = false; renderStage(); setPlayUI(); }
}

/* ---------- rendering ---------- */
function paintProgress(){
  const n = Object.keys(S.seen).length, pct = Math.round(100*n/totalSlides);
  $('#pct').textContent = pct+'%'; $('#pbar').style.width = pct+'%';
}
function renderNav(){
  $('#nav').innerHTML = MODS.map((m,i)=>{
    const done = m.slides.every((_,k)=>S.seen[key(i,k)]);
    const sub = i===S.mi ? `<div class="subs">${m.slides.map((s,k)=>`<button class="sub ${S.seen[key(i,k)]?'seen':''}" data-go="${i}:${k}" ${k===S.si?'aria-current="true"':''}>${esc(s.t)}</button>`).join('')}${m.quiz?`<button class="sub ${S.scores[m.id]!=null?'seen':''}" data-go="${i}:${m.slides.length}" ${isQuiz()?'aria-current="true"':''}>Check yourself${S.scores[m.id]!=null?' ('+S.scores[m.id]+'%)':''}</button>`:''}</div>`:'';
    return `<div><button class="mod ${done?'done':''}" data-go="${i}:0" ${i===S.mi?'aria-current="true"':''}><span class="n"><span>${i===0?'Intro':'Module '+i}</span><span>${m.w}</span></span><span class="t">${esc(m.title)}</span></button>${sub}</div>`;
  }).join('');
}
function renderStage(){
  renderNav();
  const m = mod(), st = $('#stage');
  if(isQuiz()){ renderQuiz(st); }
  else {
    const s = slides()[S.si];
    sentences = splitSentences(s.n);
    st.innerHTML = `<div class="eyebrow"><span>${i18(m)}</span><span class="w">${m.w}</span><span>Slide ${S.si+1} of ${m.slides.length}</span></div>
      <h2>${esc(s.t)}</h2>
      <div class="viz">${vizHTML(s.v)}</div>
      ${s.b?`<ul class="pts">${s.b.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
      ${s.cue?`<div class="cue"><b>Exam cue</b>${s.cue}</div>`:''}
      <div class="cap"><div class="h"><span>Narration</span><span>${sentences.length} sentences</span></div><p>${sentences.map((x,k)=>`<span class="s" data-s="${k}">${esc(x)} </span>`).join('')}</p></div>`;
  }
  $('#now').textContent = `${m.title} · ${isQuiz()?'Check yourself':slides()[S.si].t}`;
  save(); paintProgress(); setPlayUI();
}
const i18 = m => MODS.indexOf(m)===0 ? 'Exam briefing' : 'Module '+MODS.indexOf(m);

function renderQuiz(st){
  const m = mod();
  st.innerHTML = `<div class="eyebrow"><span>${i18(m)}</span><span class="w">Check yourself</span><span>${m.quiz.length} questions</span></div>
    <h2>${esc(m.title)}: quick check</h2>
    <p style="color:var(--muted);margin:0 0 16px">Exam style. Questions marked "select all" have more than one correct answer.</p>
    <form id="qf">${m.quiz.map((q,qi)=>{const multi=q.a.length>1;return `<fieldset class="q" id="q${qi}" style="margin-inline:0"><div class="kind">${multi?'Select all that apply':'Select one'}</div><h3>${qi+1}. ${esc(q.q)}</h3>${q.o.map((o,oi)=>`<label class="opt" id="o${qi}-${oi}"><input type="${multi?'checkbox':'radio'}" name="q${qi}" value="${oi}" id="i${qi}-${oi}"><span>${esc(o)}</span></label>`).join('')}<div class="why"><span class="verdict"></span> ${esc(q.w)}</div></fieldset>`}).join('')}</form>
    <div class="actions"><button class="btn pri" id="check">Check answers</button><button class="btn" id="retry" hidden>Try again</button><span class="score" id="score"></span>${S.mi<MODS.length-1?'<button class="btn" id="nextmod">Next module →</button>':''}</div>`;
  $('#check').onclick = checkQuiz; $('#retry').onclick = () => renderStage();
  const nm = $('#nextmod'); if(nm) nm.onclick = () => go(S.mi+1,0,true);
}
function checkQuiz(){
  const m = mod(); let right = 0;
  m.quiz.forEach((q,qi)=>{
    const picked = q.o.map((_,oi)=>$('#i'+qi+'-'+oi).checked);
    const ok = q.o.every((_,oi)=>picked[oi]===q.a.includes(oi));
    if(ok) right++;
    q.o.forEach((_,oi)=>{const el=$('#o'+qi+'-'+oi); el.classList.remove('ok','no'); if(q.a.includes(oi)) el.classList.add('ok'); else if(picked[oi]) el.classList.add('no'); $('#i'+qi+'-'+oi).disabled=true;});
    const box=$('#q'+qi); box.classList.add('checked',ok?'right':'wrong'); box.querySelector('.verdict').textContent = ok?'Correct.':'Not quite.';
  });
  const pct = Math.round(100*right/m.quiz.length);
  $('#score').textContent = `${right} / ${m.quiz.length} · ${pct}%`;
  $('#check').hidden = true; $('#retry').hidden = false;
  S.scores[m.id] = pct; save(); renderNav();
}

/* ---------- navigation and playback ---------- */
function go(mi,si,autoplay){
  const was = S.playing;
  stopSpeech(); S.mi = mi; S.si = si; renderStage(); window.scrollTo({top:0,behavior:'smooth'});
  if(autoplay || was){ if(!isQuiz()){ S.playing = true; setPlayUI(); speakFrom(0);} else { S.playing=false; setPlayUI(); } }
}
function step(d){
  let mi=S.mi, si=S.si+d;
  const m = MODS[mi];
  const last = m.slides.length + (m.quiz?0:-1);
  if(si<0){ if(mi>0){ mi--; si = MODS[mi].slides.length-1; } else si=0; }
  else if(si>last){ if(mi<MODS.length-1){ mi++; si=0; } else si=last; }
  S.seen[key(S.mi,S.si)] = S.si<slides().length ? 1 : S.seen[key(S.mi,S.si)];
  go(mi,si,false);
}
function setPlayUI(){
  const b = $('#play'); b.textContent = S.playing ? '❚❚ Pause' : (isQuiz() ? '▶ Replay module' : '▶ Play narration');
  b.setAttribute('aria-pressed', S.playing);
}
function toggle(){
  if(S.playing){ S.playing=false; stopSpeech(); setPlayUI(); return; }
  if(isQuiz()){ go(S.mi,0,true); return; }
  S.playing = true; setPlayUI(); speakFrom(0);
}

document.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]'); if(g){ const [a,b]=g.dataset.go.split(':').map(Number); go(a,b,false); return; }
  const sEl = e.target.closest('.cap .s'); if(sEl && S.playing){ speakFrom(+sEl.dataset.s); }
});
$('#play').onclick = toggle;
$('#prev').onclick = () => step(-1);
$('#next').onclick = () => step(1);
$('#rate').onchange = e => { S.rate = +e.target.value; save(); if(S.playing) speakFrom(sIdx); };
$('#voice').onchange = e => { S.voice = e.target.value; save(); if(S.playing) speakFrom(sIdx); };
$('#voiceOn').onchange = e => { S.voiceOn = e.target.checked; save(); if(S.playing) speakFrom(sIdx); };
document.addEventListener('keydown', e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key===' '){ e.preventDefault(); toggle(); }
  else if(e.key==='ArrowRight') step(1); else if(e.key==='ArrowLeft') step(-1);
});

/* ---------- boot ---------- */
if(S.mi>=MODS.length || S.mi<0) S.mi=0;
if(S.si<0 || S.si>MODS[S.mi].slides.length) S.si=0;
$('#rate').value = String(S.rate); if(![...$('#rate').options].some(o=>o.value===String(S.rate))) $('#rate').value='1';
$('#voiceOn').checked = S.voiceOn;
if(canSpeak){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
else { $('#voice').innerHTML='<option>Not supported</option>'; $('#voice').disabled=true; $('#voiceOn').checked=false; S.voiceOn=false; $('#voiceOn').disabled=true; }
renderStage();
window.addEventListener('pagehide', stopSpeech);
</script>

</body></html>
